name: Meta Brain shadow safety
on:
  pull_request:
    paths: ['research/meta-brain-shadow/**', '.github/workflows/meta-brain-shadow.yml']
  push:
    branches: ['feature/meta-brain-prospective-shadow-v1']
    paths: ['research/meta-brain-shadow/**', '.github/workflows/meta-brain-shadow.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/meta-brain-shadow/requirements.txt
      - run: python research/meta-brain-shadow/test_shadow.py
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          EXECUTION_ENABLED: 'false'
          SHADOW_ONLY: 'true'
